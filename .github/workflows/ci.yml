name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.7.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compat-cache/public-corpus
          key: public-corpus-${{ hashFiles('compat/public_corpus.json') }}
      - run: make public-fixtures-pull public-fixtures-check
      - run: make verify

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - run: make vuln-go
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: make vuln-python

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.7.2

  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - run: make resources-check

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPAT_TIMING_MODE: report
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compat-cache
          key: compat-local-${{ hashFiles('compat/uv.lock', 'compat/upstream.toml', 'testdata/files/*.pdf') }}
      - name: Check out pinned PDF Association fixtures
        run: make pdfa-fixtures-pull
        env:
          GO_PLAYA_PDFA_FIXTURE_DIR: ${{ runner.temp }}/pdf-association-fixtures
      - run: make corpus-test
        env:
          GO_PLAYA_PDFA_FIXTURE_DIR: ${{ runner.temp }}/pdf-association-fixtures
      - run: make compat-pdfa
        env:
          GO_PLAYA_PDFA_FIXTURE_DIR: ${{ runner.temp }}/pdf-association-fixtures
      - run: make compat-fonts compat-recovery
      - run: make compat-local

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPAT_TIMING_MODE: report
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pdf:
          - testdata/files/form_simple.pdf
          - .compat-cache/public-corpus/riscv-unprivileged.pdf
          - .compat-cache/public-corpus/gnu-emacs.pdf
          - .compat-cache/public-corpus/openintro-statistics.pdf
        space:
          - page
          - screen
          - default
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compat-cache/public-corpus
          key: public-corpus-${{ hashFiles('compat/public_corpus.json') }}
      - run: make public-fixtures-pull public-fixtures-check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .compat-cache/*.jsonl.gz
          key: compat-${{ matrix.pdf }}-${{ matrix.space }}-${{ hashFiles('compat/uv.lock', 'compat/upstream.toml', 'compat/public_corpus.json', 'testdata/files/*.pdf') }}
      - name: Compare fixture with Playa
        run: make compat-one COMPAT_PDF="${{ matrix.pdf }}" COMPAT_SPACES="${{ matrix.space }}"

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: make bench-contract-test bench-contract-check
